<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Tabungin — Kalkulator & Analisis Kesehatan Keuangan</title>
    <meta
      name="description"
      content="Kalkulator dan analisis kesehatan keuangan interaktif realtime untuk Pribadi dan Perusahaan lengkap dengan proyeksi saldo 12 bulan."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tabungin_theme_v1');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-teal-100 selection:text-teal-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-teal-900/60 dark:selection:text-teal-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
